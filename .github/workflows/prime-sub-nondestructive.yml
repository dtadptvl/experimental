name: prime-sub-nondestructive

on:
  push:
    branches:
      - test/prime-sub-nondestructive-installer
  workflow_dispatch:

jobs:
  windows-preservation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare existing Kilo environment
        shell: pwsh
        run: |
          $testProfile = Join-Path $env:RUNNER_TEMP 'ps-home'
          $fakeBin = Join-Path $env:RUNNER_TEMP 'fake-bin'
          New-Item -ItemType Directory -Force -Path "$testProfile\.config\kilo\agent", "$testProfile\.config\kilo\plugin", "$testProfile\.local\share\kilo", "$testProfile\.local\state\kilo", $fakeBin | Out-Null

          Set-Content -NoNewline -Path "$testProfile\.config\kilo\kilo.jsonc" -Value 'CONFIG-SENTINEL'
          Set-Content -NoNewline -Path "$testProfile\.config\kilo\plugin\keep.js" -Value 'PLUGIN-SENTINEL'
          Set-Content -NoNewline -Path "$testProfile\.config\kilo\agent\keep.md" -Value 'OTHER-AGENT-SENTINEL'
          Set-Content -NoNewline -Path "$testProfile\.config\kilo\agent\prime.md" -Value 'OLD-PRIME'
          Set-Content -NoNewline -Path "$testProfile\.config\kilo\agent\sub.md" -Value 'OLD-SUB'
          Set-Content -NoNewline -Path "$testProfile\.local\share\kilo\auth.json" -Value 'AUTH-SENTINEL'
          Set-Content -NoNewline -Path "$testProfile\.local\state\kilo\state.txt" -Value 'STATE-SENTINEL'

          "@echo off`r`necho fake-kilo`r`n" | Set-Content -NoNewline -Path "$fakeBin\kilo.cmd"
          "@echo off`r`necho called>\"%RUNNER_TEMP%\npm-was-called.txt\"`r`nexit /b 77`r`n" | Set-Content -NoNewline -Path "$fakeBin\npm.cmd"

          "USERPROFILE=$testProfile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$fakeBin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRIME_SUB_NO_PAUSE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run setup.cmd
        shell: cmd
        run: call prime-sub\setup.cmd

      - name: Assert non-destructive behavior
        shell: pwsh
        run: |
          $testProfile = $env:USERPROFILE
          if (Test-Path "$env:RUNNER_TEMP\npm-was-called.txt") { throw 'npm was called even though kilo already existed' }

          if ((Get-Content -Raw "$testProfile\.config\kilo\kilo.jsonc") -ne 'CONFIG-SENTINEL') { throw 'kilo.jsonc changed' }
          if ((Get-Content -Raw "$testProfile\.config\kilo\plugin\keep.js") -ne 'PLUGIN-SENTINEL') { throw 'plugin changed' }
          if ((Get-Content -Raw "$testProfile\.config\kilo\agent\keep.md") -ne 'OTHER-AGENT-SENTINEL') { throw 'other agent changed' }
          if ((Get-Content -Raw "$testProfile\.local\share\kilo\auth.json") -ne 'AUTH-SENTINEL') { throw 'auth changed' }
          if ((Get-Content -Raw "$testProfile\.local\state\kilo\state.txt") -ne 'STATE-SENTINEL') { throw 'state changed' }

          $installedPrime = Get-Content -Raw "$testProfile\.config\kilo\agent\prime.md"
          $installedSub = Get-Content -Raw "$testProfile\.config\kilo\agent\sub.md"
          $sourcePrime = Get-Content -Raw 'prime-sub\agents\prime.md'
          $sourceSub = Get-Content -Raw 'prime-sub\agents\sub.md'
          if ($installedPrime -ne $sourcePrime) { throw 'Prime was not installed exactly' }
          if ($installedSub -ne $sourceSub) { throw 'Sub was not installed exactly' }

          $backups = Get-ChildItem "$testProfile\.config\kilo\prime-sub-backups" -Directory
          if ($backups.Count -ne 1) { throw "Expected exactly one backup directory; got $($backups.Count)" }
          $backup = $backups[0].FullName
          if ((Get-Content -Raw "$backup\prime.md") -ne 'OLD-PRIME') { throw 'Prime backup incorrect' }
          if ((Get-Content -Raw "$backup\sub.md") -ne 'OLD-SUB') { throw 'Sub backup incorrect' }

  static-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer and routing invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eqi 'npm uninstall|taskkill|Remove-Item.+(kiloRoot|kiloData|kiloState|kiloCache)|reg delete' prime-sub/install.ps1 prime-sub/setup.cmd
          grep -q '### EASY' prime-sub/agents/prime.md
          grep -q '### MEDIUM' prime-sub/agents/prime.md
          grep -q '### HARD' prime-sub/agents/prime.md
          grep -q '### RECOVERY' prime-sub/agents/prime.md
          grep -q 'PRIME_DIRECT' prime-sub/agents/prime.md
          grep -q 'FAILED_TECHNICAL' prime-sub/agents/prime.md
          grep -q 'BLOCKED_EXTERNAL' prime-sub/agents/prime.md
          grep -q 'issue at most one fresh `SUB_RECOVERY` contract' prime-sub/agents/prime.md
          grep -q 'model: 9router/sub' prime-sub/agents/sub.md
